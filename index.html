<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilang Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #f4f4f9;
      color: #333;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .translation {
      text-align: left;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
    }
    .translation p {
      margin: 10px 0;
    }
    .translation img {
      width: 20px;
      height: auto;
      margin-right: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Multilang Translator</h1>
    <textarea id="inputText" placeholder="Enter text here..."></textarea>
    <button onclick="translateText()">Translate</button>
    <div class="translation" id="output"></div>
    <button onclick="copyToClipboard()">Copy</button>
  </div>

  <script>
    const flags = {
      'serbian': 'https://flagcdn.com/w40/rs.png',
      'swedish': 'https://flagcdn.com/w40/se.png',
      'austrian': 'https://flagcdn.com/w40/at.png',
      'english': 'https://flagcdn.com/w40/us.png'
    };

    async function translateText() {
      const input = document.getElementById('inputText').value;
      if (!input.trim()) {
        alert('Please enter text to translate!');
        return;
      }

      const output = document.getElementById('output');
      output.innerHTML = '<p>Translating...</p>';

      try {
        const translations = await fetchTranslations(input);
        output.innerHTML = `
          <p><img src="${flags.serbian}" alt="Serbian Flag"> <strong>Serbian:</strong> ${translations.serbian}</p>
          <p><img src="${flags.swedish}" alt="Swedish Flag"> <strong>Swedish:</strong> ${translations.swedish}</p>
          <p><img src="${flags.austrian}" alt="Austrian Flag"> <strong>German (Austrian):</strong> ${translations.german}</p>
          <p><img src="${flags.english}" alt="US Flag"> <strong>English:</strong> ${translations.english}</p>
        `;
      } catch (error) {
        output.innerHTML = '<p>Error translating text. Please try again later.</p>';
        console.error(error);
      }
    }

    async function fetchTranslations(text) {
      const apiKey = 'YOUR_GOOGLE_TRANSLATE_API_KEY'; // Replace with your actual API key
      const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;

      const languages = {
        serbian: 'sr',
        swedish: 'sv',
        german: 'de',
        english: 'en'
      };

      const promises = Object.keys(languages).map(async (key) => {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: text, target: languages[key] })
        });
        const data = await res.json();
        return { [key]: data.data.translations[0].translatedText };
      });

      const results = await Promise.all(promises);
      return Object.assign({}, ...results);
    }

    function copyToClipboard() {
      const output = document.getElementById('output').innerText;
      if (!output.trim()) {
        alert('Nothing to copy!');
        return;
      }

      navigator.clipboard.writeText(output).then(() => {
        alert('Copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
