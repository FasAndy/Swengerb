<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swengerb</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #f4f4f9;
      color: #333;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .clear-button {
      width: 40px;
      height: 40px;
      background-color: #FF4B4B;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      border: none;
      cursor: pointer;
      align-self: flex-end;
    }
    .clear-button:hover {
      background-color: #cc0000;
    }
    .translation {
      text-align: left;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
    }
    .translation p {
      margin: 10px 0;
    }
    .translation img {
      width: 20px;
      height: auto;
      margin-right: 10px;
      vertical-align: middle;
    }
    #copyButton {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Swengerb</h1>
    <div class="input-group">
      <textarea id="inputText" placeholder="Enter text here..."></textarea>
      <div style="display: flex; justify-content: space-between; width: 100%;">
        <button onclick="translateText()">Translate</button>
        <button class="clear-button" onclick="clearInput()">🗑️</button>
      </div>
    </div>
    <div class="translation" id="output"></div>
    <button id="copyButton" onclick="copyToClipboard()">Copy</button>
  </div>

  <script>
    const flags = {
      'serbian': '🇷🇸',
      'swedish': '🇸🇪',
      'german': '🇦🇹',
      'english': '🇺🇸'
    };

    async function translateText() {
      const input = document.getElementById('inputText').value;
      if (!input.trim()) {
        alert('Please enter text to translate!');
        return;
      }

      const output = document.getElementById('output');
      output.innerHTML = '<p>Translating...</p>';

      try {
        const translations = await fetchTranslations(input);
        output.innerHTML = `
          <p>${flags.serbian} ${translations.serbian}</p>
          <p>${flags.swedish} ${translations.swedish}</p>
          <p>${flags.german} ${translations.german}</p>
          <p>${flags.english} ${translations.english}</p>
        `;
      } catch (error) {
        output.innerHTML = '<p>Error translating text. Please try again later.</p>';
        console.error(error);
      }
    }

    async function fetchTranslations(text) {
      const url = 'https://libretranslate.com/translate';

      const languages = {
        serbian: 'sr',
        swedish: 'sv',
        german: 'de',
        english: 'en'
      };

      const promises = Object.keys(languages).map(async (key) => {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: text,
            source: 'auto', // Detect language automatically
            target: languages[key],
            format: 'text'
          })
        });
        const data = await res.json();
        return { [key]: data.translatedText };
      });

      const results = await Promise.all(promises);
      return Object.assign({}, ...results);
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
    }

    function copyToClipboard() {
      const output = document.getElementById('output').innerHTML;
      if (!output.trim()) {
        return;
      }

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = output;
      const textToCopy = tempDiv.textContent.replace(/\s+🇷🇸/g, '🇷🇸').replace(/\s+🇸🇪/g, '🇸🇪').replace(/\s+🇦🇹/g, '🇦🇹').replace(/\s+🇺🇸/g, '🇺🇸');

      navigator.clipboard.writeText(textToCopy).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
